name: Build Standalone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ET-Auctions.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ET-Auctions-Standalone-APK
          path: ET-Auctions.apk
          retention-days: 14
          if-no-files-found: error